            </div>
            <div id="popup-employe" class="popup-overlay">
                <div class="popup-content">
                    <span class="close-popup" id="fermer-employe">&times;</span>
                    <form id="form-employe">
                        <h2 class="titre-employe">Ajouter un employé</h2>
                        <div class="champ-group">
                            <label for="employe-nom">Nom :</label>
                            <span class="requis">Champ Obligatoire*</span>
                            <input type="text" id="employe-nom" name="nom">
                            <span id="employe-nom-error"></span>
                        </div>
                        <div class="champ-group">
                            <label for="employe-prenom">Prénom :</label>
                            <span class="requis">Champ Obligatoire*</span>
                            <input type="text" id="employe-prenom" name="prenom">
                            <span id="employe-prenom-error"></span>
                        </div>
                        <div class="champ-group">
                            <label for="employe-poste">Poste :</label>
                            <span class="requis">Champ Obligatoire*</span>
                            <input type="text" id="employe-poste" name="poste">
                            <span id="employe-poste-error"></span>
                        </div>
                        <div class="champ-group">
                            <label for="employe-adresse">Adresse :</label>
                            <span class="requis">Champ Obligatoire*</span>
                            <input type="text" id="employe-adresse" name="adresse">
                            <span id="employe-adresse-error"></span>
                        </div>
                        <div class="boutons-groupe">
                            <button type="submit">Enregistrer</button>
                            <button type="button" id="fermer-formulaire">Fermer</button>
                        </div>
                    </form>
                </div>
            </div>
            <div id="popup-suppression" class="popup-overlay">
                <div class="popup-content popup-confirmation">
                    <h2>Supprimer cet employé ?</h2>

                    <button type="button" id="annuler-suppression">Annuler</button>
